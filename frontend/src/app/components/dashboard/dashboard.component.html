<div class="dashboard-container" style="padding: 20px; font-family: sans-serif; background-color: #f1f5f9; min-height: 100vh;">
  <div class="user-info" style="max-width: 1000px; margin: 0 auto;">
    <h2 style="color: #1e293b;">Bonjour, Admin 👋</h2>
    <p style="color: #64748b;">Gestion de la bibliothèque Babelio</p>

    <div class="admin-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-top: 30px;">
      
      <div class="card" style="padding: 25px; border-radius: 12px; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid #e2e8f0;">
        <h3 style="margin-bottom: 20px; color: #0f172a;">📚 Ajouter un livre</h3>
        
        <div style="margin-bottom: 15px;">
          <label style="display: block; font-weight: 600; margin-bottom: 5px;">Titre</label>
          <input type="text" [(ngModel)]="newBook.titre" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1;">
        </div>

        <div style="margin-bottom: 15px;">
          <label style="display: block; font-weight: 600; margin-bottom: 5px;">Auteur</label>
          <input type="text" [(ngModel)]="newBook.auteur" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1;">
        </div>

        <div style="margin-bottom: 15px;">
          <label style="display: block; font-weight: 600; margin-bottom: 5px;">Catégorie</label>
          <select [(ngModel)]="newBook.category_id" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; background: white;">
            <option [ngValue]="null">Choisir une catégorie</option>
            <option value="1">Informatique</option>
            <option value="2">Littérature</option>
            <option value="3">Histoire</option>
          </select>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="display: block; font-weight: 600; margin-bottom: 5px;">URL Image</label>
          <input type="text" [(ngModel)]="newBook.image" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1;">
        </div>

        <div style="margin-bottom: 15px;">
          <label style="display: block; font-weight: 600; margin-bottom: 5px;">Contenu</label>
          <textarea [(ngModel)]="newBook.contenu" rows="3" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1;"></textarea>
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display: block; font-weight: 600; margin-bottom: 5px;">Description</label>
          <textarea [(ngModel)]="newBook.description" rows="2" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1;"></textarea>
        </div>

        <button (click)="ajouterLivre()" style="width: 100%; background-color: #059669; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 700;">
          🚀 Enregistrer le livre
        </button>
      </div>

      <div class="card" style="padding: 25px; border-radius: 12px; background: #f8fafc; border: 1px solid #e2e8f0;">
        <h3>📋 Note technique</h3>
        <p>Le formulaire est maintenant lié aux colonnes <strong>image</strong> et <strong>contenu</strong> de ta base de données.</p>
      </div>

    </div>
  </div>
</div>
