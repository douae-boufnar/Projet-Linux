<div class="admin-wrapper">
  
  <div class="admin-card form-card">
    <h3 class="admin-title">Ajouter un livre</h3>

    <div class="form-group">
      <label for="titre">Titre du livre</label>
      <input type="text" id="titre" [(ngModel)]="newBook.titre" placeholder="Ex: Les Misérables" class="form-input" />
    </div>

    <div class="form-group">
      <label for="auteur">Auteur</label>
      <input type="text" id="auteur" [(ngModel)]="newBook.auteur" placeholder="Ex: Victor Hugo" class="form-input" />
    </div>

    <div class="form-group">
      <label for="category_id">Catégorie</label>
      <select id="category_id" [(ngModel)]="newBook.category_id" class="form-input">
        <option value="1">Informatique</option>
        <option value="2">Sciences</option>
        <option value="3">Littérature</option>
        <option value="4">Histoire</option>
        <option value="5">Economie</option>
      </select>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" [(ngModel)]="newBook.description" placeholder="Résumé du livre..." class="form-input" rows="3"></textarea>
    </div>

    <button class="btn-primary" (click)="addBook()" [disabled]="loading">
      {{ loading ? 'Ajout en cours...' : 'Ajouter le livre' }}
    </button>
  </div>

  <div class="admin-card list-card">
    <h3 class="admin-title">Liste des livres</h3>
    
    <div class="table-responsive">
      <table class="admin-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Titre</th>
            <th>Auteur</th>
            <th>Catégorie</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let livre of livres">
            <td>#{{ livre.id }}</td>
            <td class="font-bold">{{ livre.titre }}</td>
            <td>{{ livre.auteur }}</td>
            <td>{{ getCategoryName(livre.category_id) }}</td>
          </tr>
          <tr *ngIf="livres.length === 0">
            <td colspan="4" class="text-center">Aucun livre disponible.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
