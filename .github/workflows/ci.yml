name: CI/CD Pipeline - Projet Linux

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  test-laravel:
    name: 🧪 Tests Laravel (Backend)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4
      - name: 🐘 Installer PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, bcmath, gd, exif, pcntl
      - name: 📦 Installer les dépendances
        working-directory: ./mon-projet-backend
        run: composer install --no-interaction --prefer-dist
      - name: ⚙️ Configurer l'environnement
        working-directory: ./mon-projet-backend
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: 🗄️ Migrer la base de données
        working-directory: ./mon-projet-backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_db
          DB_USERNAME: root
          DB_PASSWORD: "root"
        run: php artisan migrate --force
      - name: ✅ Lancer les tests
        working-directory: ./mon-projet-backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_db
          DB_USERNAME: root
          DB_PASSWORD: "root"
        run: php artisan test

  test-angular:
    name: 🧪 Tests Angular (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4
      - name: 🟢 Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: 📦 Installer les dépendances
        run: npm install
      - name: ✅ Lancer les tests
        run: npx vitest run --passWithNoTests --exclude="**/app.spec.ts"

  trigger-deploy:
    name: 🚀 Déclencher le Déploiement (main uniquement)
    runs-on: ubuntu-latest
    needs: [test-laravel, test-angular]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4
      - name: ⚙️ Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.5'
      - name: 🔐 Configurer les credentials AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3
      - name: 🔧 Initialiser Terraform
        working-directory: ./terraform
        run: terraform init
      - name: 🚀 Déployer (terraform apply)
        working-directory: ./terraform
        run: |
          terraform apply \
            -var="github_repo_url=https://github.com/douae-boufnar/Projet-Linux" \
            -auto-approve \
            -no-color
