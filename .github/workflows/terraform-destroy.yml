name: 🗑️ Terraform Destroy (Manuel)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Tapez "DESTROY" pour confirmer la suppression de toute l infra AWS'
        required: true
        type: string

jobs:
  terraform-destroy:
    name: 🗑️ Détruire l'infrastructure AWS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 🚫 Vérifier la confirmation
        if: github.event.inputs.confirm != 'DESTROY'
        run: |
          echo "❌ Vous devez taper exactement DESTROY pour confirmer."
          exit 1

      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: ⚙️ Installer Terraform 1.7.5
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.5'

      - name: 🔐 Configurer les credentials AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: 🔧 Initialiser Terraform
        working-directory: ./terraform
        run: terraform init

      - name: 🗑️ Détruire toutes les ressources AWS
        working-directory: ./terraform
        run: |
          terraform destroy \
            -var="github_repo_url=https://github.com/douae-boufnar/Projet-Linux" \
            -auto-approve \
            -no-color

      - name: ✅ Résumé
        run: |
          echo "## 🗑️ Infrastructure détruite avec succès" >> $GITHUB_STEP_SUMMARY
          echo "Toutes les ressources AWS ont été supprimées." >> $GITHUB_STEP_SUMMARY
