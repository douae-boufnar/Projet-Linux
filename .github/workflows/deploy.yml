name: CD - Master Pipeline (Deploy)

on:
  workflow_run:
    workflows: ["CI - Tests (Laravel & Angular)"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  DOCKERHUB_REPO: 'reda7856/linux-project'

jobs:
  # 1. BUILD & PUSH DOCKER IMAGES
  build-push:
    name: 🐳 Build & Push Docker Images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📝 Créer le fichier .env pour le backend
        working-directory: ./mon-projet-backend
        run: |
          cp .env.example .env
          sed -i 's|DB_HOST=127.0.0.1|DB_HOST=mysql|g' .env
          sed -i 's|DB_PASSWORD=|DB_PASSWORD=root|g' .env
          echo "APP_KEY=base64:6W+deEHpcajwq/7ePWCLToMwXD3NPu9kQG+RNjdM3vA=" >> .env

      - name: 🏗️ Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./mon-projet-backend
          push: true
          tags: ${{ env.DOCKERHUB_REPO }}:backend-latest

      - name: 🏗️ Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DOCKERHUB_REPO }}:frontend-latest

  # 2. DEPLOY (SSH)
  deploy:
    name: 🚢 Application Deployment
    needs: build-push
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Installer Terraform sur le runner
        uses: hashicorp/setup-terraform@v3

      - name: 🔐 Connexion à AWS (Configuration des credentials)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: ⚙️ Configuration du Security Group avec Terraform
        working-directory: ./terraform
        run: |
          terraform init
          terraform apply -auto-approve

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/projet
            git pull origin main
            
            # Utiliser les nouvelles images
            sed -i "s|backend-v1|backend-latest|g" docker-compose.yml
            sed -i "s|Angular_v2|frontend-latest|g" docker-compose.yml
            
            sudo docker compose pull
            sudo docker compose up -d --build
            sudo docker compose restart nginx
            sudo docker image prune -f

            echo "=== STATUS DES CONTENEURS ==="
            sudo docker compose ps

            echo "=== LOGS DU BACKEND ==="
            sudo docker compose logs backend --tail=100

            echo "=== LOGS DE NGINX ==="
            sudo docker compose logs nginx --tail=100
