services:

  backend:
    build: ./mon-projet-backend
    container_name: laravel_app
    working_dir: /var/www
    volumes:
      - ./mon-projet-backend:/var/www
    command: bash -c "chmod -R 777 storage bootstrap/cache && php artisan storage:link --force && php-fpm"
    restart: always
    depends_on:
      - mysql
    networks:
      - laravel

  # Le Nginx PRINCIPAL qui sert de Reverse Proxy global
  nginx:
    image: nginx:alpine
    container_name: main_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./mon-projet-backend:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - laravel

  frontend:
    build: ./frontend
    container_name: angular_app
    restart: always
    # Le port n'est plus exposé à l'extérieur. Nginx s'en charge.
    networks:
      - laravel

  mysql:
    build: ./mysql
    container_name: laravel_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel_db
    # Le port n'est plus exposé à l'extérieur pour plus de sécurité.
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel_phpmyadmin
    restart: always
    # Le port n'est plus exposé. Accessible via Nginx sur /phpmyadmin/
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
      PMA_ABSOLUTE_URI: /phpmyadmin/
    depends_on:
      - mysql
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  mysql_data:
